[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Unattended PR-triage agent — deterministic-first, LLM-optional"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []  # stdlib only

[tool.setuptools.packages.find]
where = ["src"]
